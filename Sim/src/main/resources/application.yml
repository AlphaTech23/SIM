spring:
  application:
    name: sim

  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/SIM
    username: sim
    password: sim
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false



server:
  port: 8080
  servlet:
    context-path: /sim

# Logs Configuration
logging:
  level:
    root: TRACE
    org.hibernate.SQL: TRACE





app:
  config:
    column-visibility:
      file: ${user.dir}/config/column-visibility.json
