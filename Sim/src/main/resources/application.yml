spring:
  application:
    name: sim

  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/SIM
    username: sim
    password: sim
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    locations: classpath:sql-init
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  servlet:
    context-path: /sim

# Logs Configuration
logging:
  level:
    root: TRACE
    org.hibernate.SQL: TRACE

jwt:
  secret: ${JWT_SECRET:Bel0Y8TSTrZyicQgAJdcabCbaMQo3s3BkBmP925Wb3g=}
  expiration: 36000

app:
  config:
    column-visibility:
      file: ${user.dir}/config/column-visibility.json