# /etc/nginx/sites-available/sim  -> lier dans sites-enabled, puis nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name 161.97.109.65;   # remplacer par le domaine des qu'il existe

    # Front Vue (build statique)
    root /var/www/sim;
    index index.html;

    access_log /var/log/nginx/sim.access.log;
    error_log  /var/log/nginx/sim.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Routes SPA : tout ce qui n'est pas un fichier retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionnes par Vite : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API : meme origine que le front, donc aucun CORS necessaire
    location /sim/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger expose publiquement = cartographie complete de l'API.
    # Decommenter pour le restreindre a ton IP :
    # location /sim/swagger-ui/ {
    #     allow TON.IP.ICI;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    # }
}
